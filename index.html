<!DOCTYPE html>
<!--
  ============================================================
  页面名称：影视热播榜选项卡（wjl_rank_list.html）
  作者：吴君龙
  建立时间：2026-11-02
  使用模型：GLM-5.3-Flash
  功能简介：一比一还原课堂测试 5 的热播榜组件——四个选项卡
            （每日 / 每周 / 每月 / 全部）切换不同榜单，榜单两列
            各 5 条，第 1~3 名红橙色序号、4~10 名灰色序号；
            JS 独立放在 js/wjl_rank.js 中外部引用，数据由 JS 渲染
  ============================================================
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>影视热播榜 · 吴君龙</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font: 14px/1.5 "Microsoft YaHei", sans-serif; background: #fff; padding: 40px 16px; }

    /* 组件整体 */
    .wjl_widget { width: 460px; margin: 0 auto; border: 1px solid #e3e3e3; padding: 10px; }

    /* 选项卡按钮区：选中的为深灰底白字 */
    .wjl_tab_bar { display: flex; }
    .wjl_tab_btn { flex: 1; height: 32px; line-height: 32px; text-align: center; background: #f5f5f5; border: 1px solid #ddd; margin-left: -1px; font-size: 14px; color: #333; cursor: pointer; }
    .wjl_tab_btn:first-child { margin-left: 0; }
    .wjl_tab_btn:hover { color: #f50; }
    .wjl_tab_btn.wjl_active { background: #3d3d3d; border-color: #3d3d3d; color: #fff; font-weight: 700; }

    /* 榜单区：左右两列各 5 条 */
    .wjl_rank_cols { display: flex; padding: 16px 8px 6px; }
    .wjl_rank_col { flex: 1; list-style: none; min-width: 0; }
    .wjl_rank_col li { height: 32px; line-height: 32px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .wjl_rank_col li:hover { color: #f50; }

    /* 序号徽章：1~3 名红橙色，4~10 名灰色 */
    .wjl_num { display: inline-block; width: 20px; height: 15px; line-height: 15px; text-align: center; margin-right: 8px; border-radius: 2px; background: #b5b5b5; color: #fff; font-size: 12px; vertical-align: 1px; }
    .wjl_num.wjl_top { background: linear-gradient(#ff8a30, #f43900); }

    /* 返回首页链接 */
    .wjl_back { display: block; width: max-content; margin: 20px auto; color: #5b7cfa; text-decoration: none; font-size: 14px; }
    .wjl_back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <!-- 影视热播榜组件：选项卡 + 榜单（榜单内容由 JS 渲染） -->
  <div class="wjl_widget">
    <!-- 选项卡按钮区：每日为默认选中（wjl_active），顺序与 JS 数据一一对应 -->
    <div class="wjl_tab_bar" id="wjl_tab_bar">
      <div class="wjl_tab_btn wjl_active">每日</div>
      <div class="wjl_tab_btn">每周</div>
      <div class="wjl_tab_btn">每月</div>
      <div class="wjl_tab_btn">全部</div>
    </div>

    <!-- 榜单内容区：由 js/wjl_rank.js 按当前选中选项卡渲染两列榜单 -->
    <div class="wjl_rank_cols" id="wjl_rank_cols"></div>
  </div>

  <a class="wjl_back" href="index.html">返回首页</a>

  <!-- 外部引用 JS：独立放在 js 文件夹中 -->
  <script src="js/wjl_rank.js"></script>
</body>
</html>
