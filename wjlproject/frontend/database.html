<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据库连接 | WJL 课程实践项目</title>
  <!--
    姓名：wujunlong | 学号：24001010912 | 时间：2026-11-19 | 大模型：DeepSeek-V4.1-Flash
    说明：数据库连接页面，输入 MySQL 用户名与密码，调用后端接口测试连接并提示结果。
  -->
  <link rel="stylesheet" href="css/wjl_index.css">
  <link rel="stylesheet" href="css/wjl_database.css">
</head>
<body>
  <canvas id="wjl_canvas" class="wjl_canvas"></canvas>
  <div class="wjl_aura wjl_aura_left"></div>
  <div class="wjl_aura wjl_aura_right"></div>

  <main class="wjl_page wjl_page_narrow">
    <a class="wjl_back" href="index.html">← 返回首页</a>

    <header class="wjl_db_head">
      <p class="wjl_hero_eyebrow">MYSQL CONNECTION</p>
      <h1 class="wjl_db_title">数据库连接</h1>
      <p class="wjl_db_desc">输入 MySQL 用户名与密码，连接结果将显示在下方。</p>
    </header>

    <section class="wjl_db_card">
      <form id="wjl_db_form" class="wjl_db_form" novalidate>
        <label class="wjl_field" for="wjl_db_user">
          <span class="wjl_field_label">用户名</span>
          <input id="wjl_db_user" class="wjl_input" type="text" value="root"
                 placeholder="请输入数据库用户名" autocomplete="username">
        </label>

        <label class="wjl_field" for="wjl_db_password">
          <span class="wjl_field_label">密码</span>
          <input id="wjl_db_password" class="wjl_input" type="password" value="wu24560832"
                 placeholder="请输入数据库密码" autocomplete="current-password">
        </label>

        <button id="wjl_db_submit" class="wjl_btn" type="submit">连接数据库</button>
      </form>

      <div id="wjl_db_result" class="wjl_result wjl_result_idle" role="status" aria-live="polite">
        <p class="wjl_result_title" id="wjl_db_result_title">等待连接</p>
        <p class="wjl_result_text" id="wjl_db_result_text">填写账号密码后点击“连接数据库”。</p>
      </div>
    </section>

    <footer class="wjl_footer">
      <span>wujunlong · 24001010912</span>
      <span>MySQL · Node.js + Express</span>
    </footer>
  </main>

  <script src="js/wjl_background.js"></script>
  <script src="js/wjl_database.js"></script>
</body>
</html>
